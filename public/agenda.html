<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#060A13">
<title>Agenda</title>
<link rel="manifest" href="/agenda.webmanifest">
<link rel="apple-touch-icon" href="/icons/agenda-180.png">
<link rel="icon" href="/icons/agenda-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060A13; --bg2:#0A1120;
  --surface:#0C1424; --card:#111A2E; --card2:#16223C;
  --border:#1C2942; --border2:#2B3D60;
  --accent:#3B82F6; --accent2:#60A5FA; --accent3:#93C5FD; --accent-deep:#1D4ED8;
  --teal:#14B8A6; --violet:#8B5CF6; --violet2:#A78BFA;
  --green:#10B981; --green2:#34D399; --green-bg:rgba(16,185,129,.10);
  --amber:#F59E0B; --amber2:#FBBF24; --amber-bg:rgba(245,158,11,.10);
  --red:#EF4444; --red-bg:rgba(239,68,68,.10);
  --text:#F2F6FC; --text2:#95A3BB; --text3:#54627E;
  --grad:linear-gradient(135deg,#2563EB 0%,#60A5FA 100%);
  --grad-verde:linear-gradient(135deg,#059669,#34D399);
  --sombra:0 12px 32px -14px rgba(0,0,0,.65);
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --disp:'Sora','DM Sans',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{font-family:var(--sans);color:var(--text);min-height:100vh;font-size:15px;
  background:
    radial-gradient(1100px 620px at 88% -12%, rgba(37,99,235,.17), transparent 62%),
    radial-gradient(900px 560px at -12% 108%, rgba(20,184,166,.10), transparent 60%),
    radial-gradient(700px 480px at 55% 118%, rgba(139,92,246,.08), transparent 55%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  background-attachment:fixed;}
button,input,select,textarea{font-family:inherit;font-size:inherit;}
button{cursor:pointer;border:none;}
input,select,textarea{color-scheme:dark;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

@keyframes subir{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
@keyframes aparecer{from{opacity:0;}to{opacity:1;}}
@keyframes latido{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.45);}50%{box-shadow:0 0 0 7px rgba(245,158,11,0);}}
@keyframes brillo{from{background-position:-460px 0;}to{background-position:460px 0;}}
@keyframes flotar{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}

/* ---------- Marca (ojo) ---------- */
.logo-mark{display:flex;align-items:center;justify-content:center;flex:none;}
.logo-mark svg{display:block;}

/* ---------- Login ---------- */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
.login-box{width:100%;max-width:392px;position:relative;border-radius:24px;padding:38px 28px 30px;
  background:linear-gradient(180deg,rgba(22,34,60,.92),rgba(13,20,36,.94));
  border:1px solid var(--border2);box-shadow:var(--sombra),0 0 90px -30px rgba(59,130,246,.35);
  backdrop-filter:blur(14px);animation:subir .5s ease both;}
.login-box::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;border-radius:24px 24px 0 0;
  background:var(--grad);}
.login-logo{width:86px;height:86px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 32% 28%, rgba(96,165,250,.28), rgba(37,99,235,.10) 62%, transparent 75%);
  border:1px solid var(--border2);box-shadow:inset 0 0 24px rgba(37,99,235,.22), 0 10px 32px -12px rgba(37,99,235,.5);
  animation:flotar 5.5s ease-in-out infinite;}
.login-box h1{font-family:var(--disp);font-size:24px;font-weight:700;text-align:center;letter-spacing:-.3px;}
.login-box .sub-login{color:var(--text2);font-size:13px;text-align:center;margin:5px 0 26px;}
.campo{margin-bottom:14px;}
.campo label{display:block;font-size:11px;color:var(--text2);margin-bottom:6px;text-transform:uppercase;
  letter-spacing:1.1px;font-weight:600;}
.campo input,.campo select,.campo textarea{width:100%;background:rgba(6,10,19,.55);border:1px solid var(--border2);
  color:var(--text);padding:13px 14px;border-radius:12px;outline:none;transition:border-color .18s, box-shadow .18s;}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(59,130,246,.18);}
.campo-icono{position:relative;}
.campo-icono svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none;}
.campo-icono input{padding-left:40px;}
.ver-pass{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;color:var(--text2);
  padding:7px 9px;border-radius:9px;font-size:15px;line-height:1;}
.ver-pass:hover{color:var(--text);}
.btn{background:var(--grad);color:#fff;padding:13px 18px;border-radius:12px;font-weight:700;width:100%;
  letter-spacing:.2px;box-shadow:0 8px 22px -8px rgba(37,99,235,.55);
  transition:transform .15s, box-shadow .15s, filter .15s;}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:translateY(1px) scale(.99);box-shadow:0 4px 12px -6px rgba(37,99,235,.5);}
.btn:disabled{opacity:.6;cursor:default;}
.btn-sec{background:var(--surface);border:1px solid var(--border2);color:var(--text);box-shadow:none;}
.btn-wa{background:linear-gradient(135deg,#16A34A,#25D366);color:#fff;box-shadow:0 8px 22px -8px rgba(37,211,102,.45);}
.btn-verde{background:var(--grad-verde);color:#fff;box-shadow:0 8px 22px -8px rgba(16,185,129,.45);}
.btn-rojo{background:transparent;border:1px solid var(--red);color:#FCA5A5;box-shadow:none;}
.btn-rojo:hover{background:var(--red-bg);}
.pie-login{margin-top:22px;text-align:center;color:var(--text3);font-size:11px;letter-spacing:.6px;text-transform:uppercase;}
.error{background:var(--red-bg);border:1px solid rgba(239,68,68,.5);color:#FCA5A5;padding:11px 13px;
  border-radius:12px;font-size:13px;margin-bottom:14px;display:none;animation:subir .25s ease both;}

/* ---------- App / header ---------- */
#app{display:none;padding-bottom:48px;animation:aparecer .35s ease both;}
header{position:sticky;top:0;z-index:30;background:rgba(6,10,19,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);padding:12px 16px 12px;}
header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent, rgba(59,130,246,.55), transparent);}
.hdr-top{display:flex;align-items:center;gap:10px;max-width:880px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:11px;flex:1;min-width:0;}
.brand h1{font-family:var(--disp);font-size:17px;font-weight:700;letter-spacing:-.2px;line-height:1.15;}
.brand h1 .fino{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.quien{font-size:11px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#brand-optica{display:none;font-size:9.5px;font-weight:700;letter-spacing:2.2px;color:var(--accent2);
  text-transform:uppercase;margin-top:2px;}
.icon-btn{position:relative;background:var(--card);border:1px solid var(--border2);color:var(--text2);
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;
  transition:transform .15s, border-color .15s, color .15s, box-shadow .15s;}
.icon-btn:hover{transform:translateY(-1px);border-color:var(--accent);color:var(--accent2);
  box-shadow:0 6px 16px -8px rgba(37,99,235,.5);}
.icon-btn svg{display:block;}
.badge{position:absolute;top:-5px;right:-5px;background:linear-gradient(135deg,#DC2626,#F87171);color:#fff;font-size:10px;
  min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center;
  padding:0 4px;font-weight:700;box-shadow:0 3px 8px rgba(220,38,38,.5);}
.hdr-tools{display:flex;gap:8px;margin-top:11px;max-width:880px;margin-left:auto;margin-right:auto;}
.hdr-tools input,.hdr-tools select{flex:1;background:rgba(17,26,46,.8);border:1px solid var(--border2);
  color:var(--text);padding:10px 12px;border-radius:11px;outline:none;font-size:14px;min-width:0;
  transition:border-color .18s, box-shadow .18s;}
.hdr-tools input:focus,.hdr-tools select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.16);}
.hdr-tools select{flex:0 0 auto;max-width:44%;}

main{padding:18px 16px;max-width:880px;margin:0 auto;}

/* ---------- Resumen (tarjetitas de arriba) ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:22px;animation:subir .4s ease both;}
.stat{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--border);border-radius:15px;
  padding:11px 8px 10px;text-align:center;cursor:pointer;transition:transform .15s, border-color .15s, box-shadow .15s;}
.stat:hover{transform:translateY(-2px);box-shadow:var(--sombra);}
.stat::before{content:'';position:absolute;inset:0 0 auto 0;height:2.5px;background:var(--stc,var(--accent));opacity:.9;}
.stat .n{font-family:var(--disp);font-size:23px;font-weight:800;line-height:1.1;color:var(--stc,var(--accent2));}
.stat .l{font-size:9.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.9px;font-weight:600;margin-top:3px;}
.stat.st-azul{--stc:#60A5FA;}
.stat.st-ambar{--stc:#FBBF24;}
.stat.st-verde{--stc:#34D399;}
.stat.st-violeta{--stc:#A78BFA;}

/* ---------- Secciones y tarjetas ---------- */
.seccion{margin-bottom:30px;animation:subir .4s ease both;}
.seccion-tit{display:flex;align-items:center;gap:9px;font-size:12px;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--text2);margin-bottom:12px;font-weight:700;}
.seccion-tit .dot{width:8px;height:8px;border-radius:50%;background:var(--sc,var(--accent));
  box-shadow:0 0 10px var(--sc,var(--accent));flex:none;}
.seccion-tit::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}
.seccion-tit .cuenta{background:var(--card);border:1px solid var(--border2);border-radius:20px;
  padding:1px 9px;font-size:11px;color:var(--text);letter-spacing:0;order:-0;}
.seccion.s-hoy{--sc:#60A5FA;}
.seccion.s-pend{--sc:#FBBF24;}
.seccion.s-mes{--sc:#A78BFA;}
.sec-cards{display:grid;gap:10px;}
@media(min-width:860px){.sec-cards{grid-template-columns:1fr 1fr;}}
.dia-tit{grid-column:1/-1;font-size:12.5px;color:var(--accent2);font-weight:700;margin:8px 0 0;
  display:flex;align-items:center;gap:8px;text-transform:capitalize;}
.dia-tit::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);}

.fila{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,var(--card),rgba(17,26,46,.7));
  border:1px solid var(--border);border-radius:16px;padding:12px 14px;cursor:pointer;position:relative;
  transition:transform .16s, border-color .16s, box-shadow .16s;}
.fila:hover{transform:translateY(-2px);border-color:var(--border2);box-shadow:var(--sombra);}
.fila:active{transform:scale(.985);}
.fila.atendido{border-color:rgba(16,185,129,.35);background:linear-gradient(180deg,rgba(16,185,129,.09),rgba(17,26,46,.75));}
.fila.nuevo{border-color:rgba(245,158,11,.45);background:linear-gradient(180deg,rgba(245,158,11,.10),rgba(17,26,46,.75));}
/* Recontrol: violeta, para que se distinga a simple vista de una consulta normal */
.fila.recontrol{border-color:rgba(167,139,250,.55);background:linear-gradient(180deg,rgba(139,92,246,.12),rgba(17,26,46,.75));}
.fila.recontrol .avatar{box-shadow:inset 0 -8px 14px rgba(0,0,0,.28),0 0 0 2px rgba(167,139,250,.55);}
.pill.recontrol{background:rgba(139,92,246,.16);color:#C4B5FD;border:1px solid rgba(167,139,250,.55);}
.motivo-linea{font-size:11.5px;color:#C4B5FD;margin-top:4px;display:flex;align-items:center;gap:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fila.cancelado{opacity:.42;}
.fila.cancelado .nom{text-decoration:line-through;}

.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  font-family:var(--disp);font-weight:700;font-size:15px;color:#fff;position:relative;letter-spacing:.5px;
  box-shadow:inset 0 -8px 14px rgba(0,0,0,.28), 0 4px 10px -4px rgba(0,0,0,.5);}
.av0{background:linear-gradient(135deg,#2563EB,#60A5FA);}
.av1{background:linear-gradient(135deg,#7C3AED,#A78BFA);}
.av2{background:linear-gradient(135deg,#0D9488,#2DD4BF);}
.av3{background:linear-gradient(135deg,#DB2777,#F472B6);}
.av4{background:linear-gradient(135deg,#D97706,#FBBF24);}
.av5{background:linear-gradient(135deg,#4F46E5,#818CF8);}
.avatar .st{position:absolute;right:-3px;bottom:-3px;width:19px;height:19px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:10.5px;border:2.5px solid var(--bg2);}
.st.st-ok{background:var(--green);color:#032117;}
.st.st-no{background:var(--red);color:#fff;font-size:9px;}
.st.st-nuevo{background:var(--amber);animation:latido 1.7s infinite;}
.avatar.grande{width:56px;height:56px;font-size:19px;}

.fila .info{flex:1;min-width:0;}
.fila .nom{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.1px;}
.fila .sub{font-size:11.5px;color:var(--text2);margin-top:3.5px;display:flex;align-items:center;gap:6px;
  white-space:nowrap;overflow:hidden;}
.fila .lado{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;}
.hora{font-family:var(--disp);font-weight:700;font-size:13.5px;color:var(--accent2);
  background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);padding:4px 9px;border-radius:9px;
  font-variant-numeric:tabular-nums;line-height:1;}
.hora.vacia{color:var(--text3);background:transparent;border:1px dashed var(--border2);font-size:10.5px;font-weight:600;}
.pill{display:inline-flex;align-items:center;font-size:9.5px;font-weight:700;padding:2.5px 8px;border-radius:20px;
  letter-spacing:.5px;text-transform:uppercase;flex:none;}
.pill.sena{background:var(--green-bg);color:var(--green2);border:1px solid rgba(16,185,129,.45);}
.pill.pagado{background:rgba(37,99,235,.15);color:#BFDBFE;border:1px solid rgba(96,165,250,.55);}
.pill.sin{background:var(--amber-bg);color:var(--amber2);border:1px solid rgba(245,158,11,.45);}
.mini-chat{display:inline-flex;align-items:center;gap:3px;background:rgba(59,130,246,.15);color:var(--accent3);
  border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700;flex:none;}

.vacio{text-align:center;color:var(--text2);padding:44px 16px;font-size:14px;animation:subir .4s ease both;}
.vacio svg{display:block;margin:0 auto 14px;opacity:.55;}

/* ---------- Cargando (esqueleto) ---------- */
.skel{height:72px;border-radius:16px;margin-bottom:10px;border:1px solid var(--border);
  background:linear-gradient(90deg,var(--card) 0%,var(--card2) 42%,var(--card) 84%);
  background-size:920px 100%;animation:brillo 1.5s linear infinite;}
.cargando{padding:8px 0;}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,6,12,.78);backdrop-filter:blur(5px);
  display:none;align-items:flex-end;justify-content:center;}
.modal.abierto{display:flex;}
.modal-box{position:relative;background:linear-gradient(180deg,#101A2E,#0C1424);border:1px solid var(--border2);
  border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:94vh;overflow-y:auto;
  padding:20px 18px 30px;box-shadow:0 -18px 60px rgba(0,0,0,.55);animation:subir .28s ease both;}
.modal-box::before{content:'';position:sticky;top:-20px;display:block;height:3px;margin:-20px -18px 17px;
  background:var(--grad);border-radius:22px 22px 0 0;}
@media(min-width:640px){.modal{align-items:center;padding:20px;}.modal-box{border-radius:22px;}
  .modal-box::before{border-radius:22px 22px 0 0;}}
.modal-hdr{display:flex;align-items:center;gap:13px;margin-bottom:18px;}
.modal-hdr h2{font-family:var(--disp);font-size:19px;flex:1;line-height:1.25;letter-spacing:-.2px;}
.cerrar{background:var(--card);border:1px solid var(--border2);color:var(--text2);font-size:20px;line-height:1;
  width:36px;height:36px;border-radius:11px;flex:none;transition:color .15s, border-color .15s;}
.cerrar:hover{color:var(--text);border-color:var(--accent);}
.datos{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:15px;overflow:hidden;margin-bottom:16px;}
.dato{background:var(--card);padding:11px 13px;}
.dato .k{font-size:9.5px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-weight:700;}
.dato .v{font-size:14.5px;margin-top:3px;word-break:break-word;font-weight:500;}
.dato.ancho{grid-column:1/-1;}
.acciones{display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap;}
.acciones .btn{flex:1;min-width:130px;width:auto;display:flex;align-items:center;justify-content:center;gap:8px;}
.pago-banner{display:flex;align-items:center;gap:13px;border-radius:16px;padding:14px 15px;margin-bottom:14px;
  border:1px solid var(--border2);background:var(--card);}
.pago-banner .pago-icono{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  flex:none;background:rgba(16,185,129,.13);color:var(--green2);}
.pago-banner .pago-titulo{font-family:var(--disp);font-size:16px;font-weight:800;letter-spacing:-.15px;}
.pago-banner .pago-detalle{font-size:12.5px;color:var(--text2);margin-top:2px;line-height:1.35;}
.pago-banner.pagado{border-color:rgba(96,165,250,.5);background:linear-gradient(135deg,rgba(37,99,235,.16),rgba(17,26,46,.9));}
.pago-banner.pagado .pago-icono{background:rgba(59,130,246,.18);color:#BFDBFE;}
.pago-banner.sena{border-color:rgba(52,211,153,.48);background:linear-gradient(135deg,rgba(16,185,129,.14),rgba(17,26,46,.9));}
.pago-banner.recontrol{border-color:rgba(167,139,250,.5);background:linear-gradient(135deg,rgba(139,92,246,.14),rgba(17,26,46,.9));}
.pago-banner.recontrol .pago-icono{background:rgba(139,92,246,.18);color:#C4B5FD;}
.acciones-consulta{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px;}
.btn-atendido{min-height:52px;background:var(--grad-verde);font-size:15px;box-shadow:0 8px 22px -8px rgba(16,185,129,.5);}
.acciones-secundarias{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.acciones-secundarias .btn{min-height:46px;}
.bloque{border:1px solid var(--border);border-radius:16px;padding:15px;margin-bottom:14px;
  background:linear-gradient(180deg,var(--card),rgba(12,20,36,.6));}
.bloque h3{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--accent2);
  margin-bottom:12px;font-weight:700;display:flex;align-items:center;gap:7px;}
.bloque h3::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}
.fila-campos{display:flex;gap:10px;}
.fila-campos .campo{flex:1;margin-bottom:0;}
.receta-prev{width:100%;border-radius:14px;border:1px solid var(--border2);margin-top:12px;display:none;
  box-shadow:var(--sombra);}

@media(max-width:420px){
  .acciones-secundarias{grid-template-columns:1fr;}
  .pago-banner{padding:13px;}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;}
}

/* ---------- Chat ---------- */
.chat-msgs{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin-bottom:11px;
  padding:4px 2px;scroll-behavior:smooth;}
.msg{max-width:84%;padding:8px 11px 6px;border-radius:14px;font-size:14px;line-height:1.45;

/* Mensajes seguidos de la misma persona: se pegan, como en WhatsApp */

<script>
/* ═══════════════════════════════════════════════════════════
   Estado
   ═══════════════════════════════════════════════════════════ */
let SESION = null;
let AGENDA = [];
let FICHA = null;            // registro abierto en el modal
let NO_LEIDOS = {};          // { agenda_id|'general': cantidad }
let VISTOS = new Set();      // ids ya vistos, para avisar solo de los nuevos
let TIMER = null;

const API = '/api/medico';

/* ═══════════════════════════════════════════════════════════
   Utilidades
   ═══════════════════════════════════════════════════════════ */
async function sha256(txt){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function esc(s){
  return String(s??'').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showToast(msg, tipo){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = tipo || '';
  t.style.display = 'block';
  clearTimeout(t._t);
  t._t = setTimeout(()=>{ t.style.display='none'; }, 4500);
}

async function api(ruta, opciones){
  const o = opciones || {};
  o.headers = Object.assign({'Content-Type':'application/json'}, o.headers||{});
  if (SESION && SESION.token) o.headers['X-Medico-Token'] = SESION.token;
  const res = await fetch(API + ruta, o);
  if (res.status === 401 && SESION){
    cerrarSesion();
    showToast('La sesión venció, entrá de nuevo', 'err');
    throw new Error('sesion');
  }
  return res.json();
}

/** Fecha local en formato YYYY-MM-DD (sin correrse de día por la zona horaria). */
function hoyISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function soloFecha(valor){
  if (!valor) return '';
  return String(valor).slice(0,10);
}

function fechaLarga(iso){
  if (!iso) return '';
  const [a,m,d] = iso.split('-').map(Number);
  const f = new Date(a, m-1, d);
  const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','setiembre','octubre','noviembre','diciembre'];
  return dias[f.getDay()] + ' ' + d + ' de ' + meses[m-1];
}

function horaCorta(ts){
  if (!ts) return '';
  const f = new Date(ts);
  return String(f.getHours()).padStart(2,'0') + ':' + String(f.getMinutes()).padStart(2,'0');
}

function haceCuanto(ts){
  if (!ts) return '';
  const min = Math.floor((Date.now() - new Date(ts).getTime()) / 60000);
  if (min < 1) return 'recién';
  if (min < 60) return 'hace ' + min + ' min';
  const hs = Math.floor(min/60);
  if (hs < 24) return 'hace ' + hs + (hs===1?' hora':' horas');
  const d = Math.floor(hs/24);
  return 'hace ' + d + (d===1?' día':' días');
}

/** Iniciales para el avatar: "MARIA FERNANDEZ" -> "MF". */
function iniciales(nombre){
  const p = String(nombre||'').trim().split(/\s+/);
  return (((p[0]||'')[0]||'?') + ((p[1]||'')[0]||'')).toUpperCase();
}

/** Color estable por nombre (0-5), para que cada paciente conserve el suyo. */
function hueDe(nombre){
  let h = 0;
  const s = String(nombre||'');
  for (let i = 0; i < s.length; i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return h % 6;
}

function verPass(){
  const i = document.getElementById('inp-pass');
  i.type = i.type === 'password' ? 'text' : 'password';
}

function irA(id){
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

/** Uruguay: 09X XXX XXX -> 5989XXXXXXX. Devuelve '' si no parece celular. */
function telWhatsApp(tel){
  const d = String(tel||'').replace(/\D/g,'');
  if (!d) return '';
  if (d.startsWith('598')) return d;
  if (d.startsWith('0')) return '598' + d.slice(1);
  if (d.length === 8 && d.startsWith('9')) return '598' + d;
  return '598' + d;
}

function montoNum(valor){
  return Number(String(valor||'').replace(/[^\d]/g,'')) || 0;
}

/** Estado económico que las secretarias necesitan antes de atender. */
function pagoPaciente(r){
  if (r.es_recontrol){
    return {
      tipo:'recontrol', titulo:'RE-CONTROL AUTORIZADO',
      detalle:'Consulta sin costo autorizada por la óptica'
    };
  }
  const total = montoNum(r.total);
  const sena = montoNum(r.sena);
  const saldo = montoNum(r.saldo);
  if (total > 0 && saldo <= 0){
    return {
      tipo:'pagado', titulo:'PAGADO · PUEDE ATENDERSE',
      detalle:'La venta quedó totalmente paga en la óptica'
    };
  }
  if (sena > 0){
    return {
      tipo:'sena', titulo:'SEÑÓ · PUEDE ATENDERSE',
      detalle:'Seña registrada: $' + sena.toLocaleString('es-UY')
    };
  }
  return {
    tipo:'sin', titulo:'PAGO SIN DETALLE',
    detalle:'Registro anterior: confirmar el detalle con la óptica'
  };
}

function pagoBannerHTML(r){
  const p = pagoPaciente(r);
  const icono = p.tipo === 'recontrol'
    ? '<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-5V2"/><path d="M4 17h5v5"/><path d="M5.6 9A7 7 0 0 1 17 5l3 2M4 17l3 2a7 7 0 0 0 11.4-4"/></svg>'
    : '<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>';
  return '<div class="pago-icono" aria-hidden="true">' + icono + '</div>' +
         '<div><div class="pago-titulo">' + esc(p.titulo) + '</div>' +
         '<div class="pago-detalle">' + esc(p.detalle) + '</div></div>';
}

/* ═══════════════════════════════════════════════════════════
   Login
   ═══════════════════════════════════════════════════════════ */
async function doLogin(evento){
  if (evento) evento.preventDefault();   // el form no navega, lo manejamos acá
  const u = document.getElementById('inp-user').value.trim();
  const p = document.getElementById('inp-pass').value;
  const err = document.getElementById('login-error');
  err.style.display = 'none';
  if (!u || !p){ err.textContent='Completá usuario y contraseña'; err.style.display='block'; return; }

  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  btn.textContent = 'Entrando…';
  try{
    const hash = await sha256(p);
    const res = await fetch(API + '/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({usuario:u, password_hash:hash})
    });
    const json = await res.json();
    if (!json.success){
      err.textContent = json.error || 'Usuario o contraseña incorrectos';
      err.style.display = 'block';
      return;
    }
    SESION = json.data;
    guardarSesion();
    // Pedirle al navegador que guarde el usuario y la contraseña, para que la
    // próxima vez alcance con tocar el campo y elegirlos. En Chrome y Edge se
    // pide explícito; Safari lo detecta solo por el envío del formulario.
    try{
      if (window.PasswordCredential){
        await navigator.credentials.store(
          new window.PasswordCredential({id: u, password: p, name: SESION.nombre || u}));
      }
    }catch(e){}
    arrancar();
  }catch(e){
    err.textContent = 'No se pudo conectar. Revisá internet.';
    err.style.display = 'block';
  }finally{
    btn.disabled = false;
    btn.textContent = 'Entrar →';
  }
}

/* La sesión queda guardada en el teléfono y se renueva sola mientras se use,
   así no hay que escribir la contraseña cada vez. Se corta desde el botón
   Salir, o cambiando la contraseña con crear_usuarios_medico.py, que echa a
   todos los dispositivos de esa persona. */
function guardarSesion(){
  try{ localStorage.setItem('medico_sesion', JSON.stringify(SESION)); }catch(e){}
}

function olvidarSesion(){
  try{ localStorage.removeItem('medico_sesion'); }catch(e){}
  try{ sessionStorage.removeItem('medico_sesion'); }catch(e){}   // sesiones viejas
}

function cerrarSesion(){
  SESION = null;
  olvidarSesion();
  pararReloj();
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  document.getElementById('inp-pass').value = '';
}

function arrancar(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('quien').textContent = SESION.nombre || SESION.usuario;
  // El sello de la óptica solo lo ve el usuario roma: en el teléfono del
  // consultorio la página queda sin marca, a propósito.
  document.getElementById('brand-optica').style.display =
    (SESION.rol === 'optica') ? 'block' : 'none';
  llenarMeses();
  cargarAgenda(true);
  arrancarReloj();
  revisarNotificaciones();
}

/** Consultar cada minuto, pero SOLO con la página a la vista.
 *  Cada consulta despierta la base, que se paga por tiempo despierta: con el
 *  celular en el bolsillo no tiene sentido seguir preguntando. Al volver a la
 *  pantalla se refresca en el acto, así que no se pierde nada. */
function arrancarReloj(){
  clearInterval(TIMER);
  if (!SESION || document.hidden) return;
  TIMER = setInterval(refrescar, 60000);
}

function pararReloj(){
  clearInterval(TIMER);
  TIMER = null;
}

function llenarMeses(){
  const sel = document.getElementById('sel-mes');
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','setiembre','octubre','noviembre','diciembre'];
  const hoy = new Date();
  let html = '';
  for (let i = 0; i < 12; i++){
    const f = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    const val = f.getFullYear() + '-' + String(f.getMonth()+1).padStart(2,'0');
    html += '<option value="'+val+'">' + meses[f.getMonth()] + ' ' + f.getFullYear() + '</option>';
  }
  sel.innerHTML = html;
}

/* ═══════════════════════════════════════════════════════════
   Carga de datos
   ═══════════════════════════════════════════════════════════ */
async function cargarAgenda(primera){
  try{
    const mes = document.getElementById('sel-mes').value;
    const json = await api('/agenda?mes=' + encodeURIComponent(mes));
    if (!json.success){ showToast(json.error || 'No se pudo cargar', 'err'); return; }

    const antes = AGENDA.length;
    AGENDA = json.data;

    // Avisar de los que llegaron desde la última vuelta (no en la primera carga)
    if (!primera){
      const nuevos = AGENDA.filter(r => !VISTOS.has(r.id));
      if (nuevos.length === 1){
        showToast('Llegó ' + (nuevos[0].nombre || 'un paciente nuevo'), 'nuevo');
      } else if (nuevos.length > 1){
        showToast('Llegaron ' + nuevos.length + ' pacientes nuevos', 'nuevo');
      }
    }
    AGENDA.forEach(r => VISTOS.add(r.id));
    render();
  }catch(e){
    if (String(e.message) !== 'sesion') showToast('Sin conexión', 'err');
  }
}

async function cargarNoLeidos(){
  try{
    const json = await api('/mensajes?no_leidos=1');
    if (!json.success) return;
    NO_LEIDOS = {};
    json.data.forEach(r => { NO_LEIDOS[r.agenda_id === null ? 'general' : r.agenda_id] = r.cantidad; });
    const b = document.getElementById('badge-general');
    const g = NO_LEIDOS['general'] || 0;
    b.textContent = g;
    b.style.display = g ? 'flex' : 'none';
  }catch(e){}
}

async function refrescar(){
  await cargarAgenda();
  await cargarNoLeidos();
  if (FICHA) cargarChat(FICHA.id);
}

/* ═══════════════════════════════════════════════════════════
   Render de la lista
   ═══════════════════════════════════════════════════════════ */
function render(){
  const cont = document.getElementById('contenido');
  const filtro = document.getElementById('buscador').value.trim().toLowerCase();

  let datos = AGENDA;
  if (filtro){
    datos = datos.filter(r =>
      String(r.nombre||'').toLowerCase().includes(filtro) ||
      String(r.cedula||'').toLowerCase().includes(filtro));
  }

  const hoy = hoyISO();
  const deHoy      = datos.filter(r => soloFecha(r.fecha_agendada) === hoy && r.estado !== 'cancelado');
  const pendientes = datos.filter(r => r.estado === 'pendiente');
  const resto      = datos.filter(r => !deHoy.includes(r) && !pendientes.includes(r));

  // Resumen de arriba: tocás una tarjeta y te lleva a esa sección
  const atendidos = datos.filter(r => r.estado === 'atendido').length;
  const stats =
    '<div class="stats">' +
    statTile(deHoy.length, 'Hoy', 'st-azul', 'sec-hoy') +
    statTile(pendientes.length, 'Sin hora', 'st-ambar', 'sec-pend') +
    statTile(atendidos, 'Atendidos', 'st-verde', 'sec-mes') +
    statTile(datos.length, 'Este mes', 'st-violeta', 'sec-mes') +
    '</div>';

  let html = '';

  if (deHoy.length){
    deHoy.sort((a,b) => String(a.hora_agendada||'99').localeCompare(String(b.hora_agendada||'99')));
    html += seccion('Hoy', deHoy.length, deHoy.map(fila).join(''), 'sec-hoy', 's-hoy');
  }

  if (pendientes.length){
    // Los que acaban de señar van arriba de todo: pueden estar yendo al
    // consultorio ahora mismo. El resto, por orden de llegada (el que hace
    // más que espera, primero).
    pendientes.sort((a,b) => {
      const ra = esReciente(a), rb = esReciente(b);
      if (ra !== rb) return ra ? -1 : 1;
      return new Date(a.creado_en) - new Date(b.creado_en);
    });
    html += seccion('Falta darles hora', pendientes.length, pendientes.map(fila).join(''), 'sec-pend', 's-pend');
  }

  if (resto.length){
    // Agrupados por día: primero los que tienen día asignado, después por fecha de seña
    const grupos = {};
    resto.forEach(r => {
      const dia = soloFecha(r.fecha_agendada) || soloFecha(r.fecha_sena) || 'Sin fecha';
      (grupos[dia] = grupos[dia] || []).push(r);
    });
    const dias = Object.keys(grupos).sort().reverse();
    let cuerpo = '';
    dias.forEach(d => {
      grupos[d].sort((a,b) => String(a.hora_agendada||'99').localeCompare(String(b.hora_agendada||'99')));
      cuerpo += '<div class="dia-tit">' + esc(d === 'Sin fecha' ? d : fechaLarga(d)) + '</div>';
      cuerpo += grupos[d].map(fila).join('');
    });
    html += seccion('Del mes', resto.length, cuerpo, 'sec-mes', 's-mes');
  }

  if (!html){
    html = '<div class="vacio">' +
      '<svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#54627E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 9h18"/>' +
      '<circle cx="12" cy="15" r="2.4"/></svg>' +
      (filtro ? 'Ningún paciente coincide con la búsqueda.'
              : 'Todavía no hay pacientes este mes.') + '</div>';
  }
  cont.innerHTML = stats + html;
}

function statTile(n, label, tono, destino){
  return '<div class="stat ' + tono + '" onclick="irA(\'' + destino + '\')">' +
         '<div class="n">' + n + '</div><div class="l">' + esc(label) + '</div></div>';
}

function seccion(titulo, cuenta, cuerpo, id, tono){
  return '<div class="seccion ' + (tono||'') + '" id="' + (id||'') + '">' +
         '<div class="seccion-tit"><span class="dot"></span>' + esc(titulo) +
         '<span class="cuenta">' + cuenta + '</span></div>' +
         '<div class="sec-cards">' + cuerpo + '</div></div>';
}

function fila(r){
  let clase = 'fila';
  if (r.estado === 'atendido') clase += ' atendido';
  else if (r.estado === 'cancelado') clase += ' cancelado';
  else if (r.es_recontrol) clase += ' recontrol';   // el violeta manda sobre el ámbar
  else if (esReciente(r)) clase += ' nuevo';

  // Avatar con iniciales y color propio; la burbujita de estado va encima
  const st = r.estado === 'atendido' ? '<span class="st st-ok">✓</span>'
           : r.estado === 'cancelado' ? '<span class="st st-no">✕</span>'
           : esReciente(r) ? '<span class="st st-nuevo"></span>' : '';
  const avatar = '<div class="avatar av' + hueDe(r.nombre) + '">' +
                 esc(iniciales(r.nombre)) + st + '</div>';

  const hora = r.hora_agendada
    ? '<div class="hora">' + esc(String(r.hora_agendada).slice(0,5)) + '</div>'
    : '<div class="hora vacia">sin hora</div>';

  const pago = pagoPaciente(r);
  const sena = montoNum(r.sena);
  const pill = r.es_recontrol
    ? '<span class="pill recontrol">re-control</span>'
    : pago.tipo === 'pagado'
      ? '<span class="pill pagado">pagado</span>'
      : pago.tipo === 'sena'
        ? '<span class="pill sena">seña $' + sena.toLocaleString('es-UY') + '</span>'
        : '<span class="pill sin">pago sin detalle</span>';

  const sinLeer = NO_LEIDOS[r.id]
    ? '<span class="mini-chat">💬 ' + NO_LEIDOS[r.id] + '</span>' : '';

  const sub = pill + '<span>' + esc(r.cedula || 'sin cédula') +
              (esReciente(r) ? ' · llegó ' + haceCuanto(r.fecha_sena) : '') +
              '</span>' + sinLeer;

  // Motivo del recontrol, en su propia línea para que Enzo lo lea de una
  const motivo = (r.es_recontrol && r.motivo)
    ? '<div class="motivo-linea">🔄 ' + esc(r.motivo) + '</div>' : '';

  return '<div class="' + clase + '" onclick="abrirFicha(' + r.id + ')">' + avatar +
         '<div class="info"><div class="nom">' + esc(r.nombre || 'Sin nombre') + '</div>' +
         '<div class="sub">' + sub + '</div>' + motivo + '</div>' +
         '<div class="lado">' + hora + '</div></div>';
}

/** "Recién llegó": dejó la seña en la última hora y todavía no lo atendieron. */
function esReciente(r){
  if (r.estado === 'atendido' || r.estado === 'cancelado') return false;
  if (!r.fecha_sena) return false;
  return (Date.now() - new Date(r.fecha_sena).getTime()) < 3600000;
}

/* ═══════════════════════════════════════════════════════════
   Ficha del paciente
   ═══════════════════════════════════════════════════════════ */
function abrirFicha(id){
  const r = AGENDA.find(x => x.id === id);
  if (!r) return;
  FICHA = r;

  document.getElementById('f-nombre').textContent = r.nombre || 'Sin nombre';
  const fav = document.getElementById('f-avatar');
  fav.className = 'avatar grande av' + hueDe(r.nombre);
  fav.textContent = iniciales(r.nombre);

  const pago = pagoPaciente(r);
  const total = montoNum(r.total);
  const sena = montoNum(r.sena);
  const saldo = montoNum(r.saldo);
  const bannerPago = document.getElementById('f-pago');
  bannerPago.className = 'pago-banner ' + pago.tipo;
  bannerPago.innerHTML = pagoBannerHTML(r);

  const d = [
    ['Cédula',            r.cedula || '—'],
    ['Teléfono',          r.telefono || '—'],
    ['Nacimiento',        r.fnac || '—'],
    ['Edad',              r.edad ? r.edad + ' años' : '—'],
    ['Total',             total ? '$' + total.toLocaleString('es-UY') : '—'],
    ['Seña',              sena ? '$' + sena.toLocaleString('es-UY') : '—'],
    ['Saldo',             r.total != null && r.total !== '' ? '$' + saldo.toLocaleString('es-UY') : '—'],
    ['Estado',            {pendiente:'Falta darle hora', agendado:'Agendado',
                           atendido:'Atendido', cancelado:'Canceló',
                           archivado:'Archivado'}[r.estado] || r.estado],
  ];
  // El recontrol se muestra arriba de todo y bien visible, con su motivo
  if (r.es_recontrol){
    d.unshift(['🔄 Re-control', r.motivo || 'Sin motivo anotado']);
  }
  document.getElementById('f-datos').innerHTML = d.map(([k,v], i) => {
    const destacar = r.es_recontrol && i === 0
      ? ' style="grid-column:1/-1;background:rgba(139,92,246,.14)"' : '';
    return '<div class="dato"' + destacar + '><div class="k">' + esc(k) +
           '</div><div class="v">' + esc(v) + '</div></div>';
  }).join('');

  document.getElementById('f-fecha').value = soloFecha(r.fecha_agendada);
  document.getElementById('f-hora').value  = r.hora_agendada ? String(r.hora_agendada).slice(0,5) : '';
  document.getElementById('f-wa').style.display = r.telefono ? '' : 'none';
  const btnAtendido = document.getElementById('btn-atendido');
  btnAtendido.disabled = r.estado === 'atendido';
  btnAtendido.textContent = r.estado === 'atendido' ? 'Atendido' : 'Marcar como atendido';

  prepararEdicion(r);
  const ta = document.getElementById('f-chat-txt');
  ta.value = '';
  cargarChat(r.id);
  arrancarRelojChat(r.id);
  cargarHistorial(r);
  document.getElementById('modal-ficha').classList.add('abierto');
  ajustarAltura(ta);   // recién ahora se puede medir: el modal ya está visible
}

function cerrarFicha(){
  FICHA = null;
  pararRelojChat();
  document.getElementById('modal-ficha').classList.remove('abierto');
}

/** Consultas anteriores del mismo paciente, canceladas incluidas: si alguien
 *  se vuelve a agendar, conviene saber si ya había faltado antes. */
async function cargarHistorial(r){
  const bloque = document.getElementById('f-hist-bloque');
  const cont = document.getElementById('f-hist');
  bloque.style.display = 'none';
  cont.innerHTML = '';
  if (!r.cedula) return;

  try{
    const json = await api('/agenda?historial_cedula=' + encodeURIComponent(r.cedula) +
                           '&excluir_id=' + r.id);
    if (!json.success || !json.data.length) return;

    const etiqueta = {
      atendido:  ['Se atendió',      'var(--green)'],
      cancelado: ['No vino / canceló','var(--red)'],
      archivado: ['Quedó sin agendar','var(--text3)'],
      pendiente: ['Sin hora',        'var(--amber)'],
      agendado:  ['Agendado',        'var(--accent2)'],
    };

    cont.innerHTML = json.data.map(h => {
      const [txt, color] = etiqueta[h.estado] || [h.estado, 'var(--text2)'];
      const dia = soloFecha(h.fecha_agendada) || soloFecha(h.fecha_sena) || soloFecha(h.creado_en);
      const fecha = dia ? dia.split('-').reverse().join('/') : '—';
      const hora = h.hora_agendada ? ' ' + String(h.hora_agendada).slice(0,5) : '';
      return '<div style="display:flex;gap:10px;align-items:baseline;padding:6px 0;' +
             'border-top:1px solid var(--border)">' +
             '<span style="color:var(--text2);font-size:13px;min-width:92px">' +
             esc(fecha + hora) + '</span>' +
             '<span style="color:' + color + ';font-size:13px;font-weight:600">' + esc(txt) + '</span>' +
             '</div>';
    }).join('');

    const cancelados = json.data.filter(h => h.estado === 'cancelado').length;
    if (cancelados){
      cont.innerHTML = '<div style="color:var(--amber);font-size:13px;margin-bottom:6px">⚠ ' +
        (cancelados === 1 ? 'Ya faltó una vez' : 'Ya faltó ' + cancelados + ' veces') +
        '</div>' + cont.innerHTML;
    }
    bloque.style.display = 'block';
  }catch(e){}
}

function abrirWhatsApp(){
  if (!FICHA || !FICHA.telefono) return;
  const num = telWhatsApp(FICHA.telefono);
  const nombre = (FICHA.nombre || '').split(' ')[0];
  const txt = 'Hola ' + nombre + ', te escribimos del consultorio para coordinar el día y la hora de tu consulta.';
  window.open('https://wa.me/' + num + '?text=' + encodeURIComponent(txt), '_blank');
}

async function guardarAgenda(){
  if (!FICHA) return;
  const fecha = document.getElementById('f-fecha').value;
  const hora  = document.getElementById('f-hora').value;
  try{
    const json = await api('/agenda?id=' + FICHA.id, {
      method:'PATCH',
      body: JSON.stringify({fecha_agendada: fecha || null, hora_agendada: hora || null})
    });
    if (!json.success){ showToast(json.error || 'No se pudo guardar', 'err'); return; }
    aplicar(json.data);
    showToast('Guardado', 'ok');
  }catch(e){ showToast('Sin conexión', 'err'); }
}

async function marcarAtendido(){
  if (!FICHA || FICHA.estado === 'atendido') return;
  const nombre = FICHA.nombre || 'este paciente';
  if (!confirm('¿Confirmás que ' + nombre + ' ya fue atendido por el médico?')) return;

  const btn = document.getElementById('btn-atendido');
  btn.disabled = true;
  btn.textContent = 'Guardando…';
  try{
    const json = await api('/agenda?id=' + FICHA.id, {
      method:'PATCH', body: JSON.stringify({estado:'atendido'})
    });
    if (!json.success){
      btn.disabled = false;
      btn.textContent = 'Marcar como atendido';
      showToast(json.error || 'No se pudo guardar', 'err');
      return;
    }
    aplicar(json.data);
    cerrarFicha();
    showToast('Paciente marcado como atendido', 'ok');
  }catch(e){
    btn.disabled = false;
    btn.textContent = 'Marcar como atendido';
    showToast('Sin conexión. Probá nuevamente.', 'err');
  }
}

/** Edición y borrado: solo el usuario de la óptica, que es el dueño de los datos. */
function esOptica(){
  return SESION && SESION.rol === 'optica';
}

function prepararEdicion(r){
  const bloque = document.getElementById('f-editar-bloque');
  if (!esOptica()){ bloque.style.display = 'none'; return; }
  document.getElementById('e-nombre').value   = r.nombre || '';
  document.getElementById('e-cedula').value   = r.cedula || '';
  document.getElementById('e-telefono').value = r.telefono || '';
  document.getElementById('e-fnac').value     = r.fnac || '';
  document.getElementById('e-sena').value     = r.sena || '';

  document.getElementById('e-recontrol').checked = !!r.es_recontrol;
  document.getElementById('e-motivo').value = r.motivo || '';
  document.getElementById('e-motivo-campo').style.display = r.es_recontrol ? 'block' : 'none';
  document.getElementById('btn-guardar-recontrol').style.display = 'none';

  bloque.style.display = 'block';
}

/** El botón de guardar el recontrol solo aparece si cambió algo respecto a la ficha. */
function toggleMotivoFicha(){
  const on = document.getElementById('e-recontrol').checked;
  document.getElementById('e-motivo-campo').style.display = on ? 'block' : 'none';
  document.getElementById('btn-guardar-recontrol').style.display = 'block';
}

async function guardarRecontrol(){
  if (!FICHA) return;
  const on = document.getElementById('e-recontrol').checked;
  const motivo = on ? document.getElementById('e-motivo').value.trim() : '';
  try{
    const json = await api('/agenda?id=' + FICHA.id, {
      method:'PATCH',
      body: JSON.stringify({es_recontrol: on, motivo: motivo})
    });
    if (!json.success){ showToast(json.error || 'No se pudo guardar', 'err'); return; }
    aplicar(json.data);
    document.getElementById('btn-guardar-recontrol').style.display = 'none';
    showToast(on ? 'Marcado como re-control' : 'Ya no es re-control', 'ok');
  }catch(e){ showToast('Sin conexión', 'err'); }
}

async function guardarDatos(){
  if (!FICHA) return;
  const cuerpo = {
    nombre:   document.getElementById('e-nombre').value.trim().toUpperCase(),
    cedula:   document.getElementById('e-cedula').value.trim(),
    telefono: document.getElementById('e-telefono').value.trim(),
    fnac:     document.getElementById('e-fnac').value.trim(),
    sena:     document.getElementById('e-sena').value.trim(),
  };
  if (!cuerpo.nombre){ showToast('El nombre no puede quedar vacío', 'err'); return; }

  try{
    const json = await api('/agenda?id=' + FICHA.id, {method:'PATCH', body: JSON.stringify(cuerpo)});
    if (!json.success){ showToast(json.error || 'No se pudo guardar', 'err'); return; }
    const id = FICHA.id;
    aplicar(json.data);
    abrirFicha(id);   // redibujar la ficha entera con los datos nuevos
    showToast('Datos actualizados', 'ok');
  }catch(e){ showToast('Sin conexión', 'err'); }
}

async function eliminarRegistro(){
  if (!FICHA) return;
  const nom = FICHA.nombre || 'este paciente';
  if (!confirm('¿Eliminar a ' + nom + ' de la agenda?\n\n' +
               'Se borra también su chat. Esto no se puede deshacer y el médico ' +
               'deja de verlo.\n\nSi solo faltó a la consulta, usá "No vino / canceló", ' +
               'que conserva el registro.')) return;

  try{
    const json = await api('/agenda?id=' + FICHA.id, {method:'DELETE'});
    if (!json.success){ showToast(json.error || 'No se pudo eliminar', 'err'); return; }
    AGENDA = AGENDA.filter(x => x.id !== FICHA.id);
    cerrarFicha();
    render();
    showToast('Eliminado', 'ok');
  }catch(e){ showToast('Sin conexión', 'err'); }
}

async function marcarCancelado(){
  if (!FICHA) return;
  if (!confirm('¿Marcar a ' + (FICHA.nombre||'este paciente') + ' como que no vino o canceló?')) return;
  try{
    const json = await api('/agenda?id=' + FICHA.id, {
      method:'PATCH', body: JSON.stringify({estado:'cancelado'})
    });
    if (!json.success){ showToast(json.error || 'No se pudo guardar', 'err'); return; }
    aplicar(json.data);
    cerrarFicha();
    showToast('Marcado como cancelado', 'ok');
  }catch(e){ showToast('Sin conexión', 'err'); }
}

/** Reemplaza el registro en la lista y vuelve a dibujar sin recargar todo. */
function aplicar(reg){
  const i = AGENDA.findIndex(x => x.id === reg.id);
  if (i >= 0) AGENDA[i] = Object.assign({}, AGENDA[i], reg);
  if (FICHA && FICHA.id === reg.id) FICHA = AGENDA[i];
  render();
}

/* ═══════════════════════════════════════════════════════════
   Chat
   ═══════════════════════════════════════════════════════════ */
/** Mi rol como autor de mensajes. */
function miAutor(){
  return (SESION && SESION.rol === 'optica') ? 'optica' : 'consultorio';
}

/** Separador de días: "Hoy", "Ayer" o la fecha. */
function etiquetaDia(iso){
  const dia = soloFecha(iso);
  if (!dia) return '';
  if (dia === hoyISO()) return 'Hoy';
  const ayer = new Date(Date.now() - 86400000);
  const ayerISO = ayer.getFullYear() + '-' + String(ayer.getMonth()+1).padStart(2,'0') +
                  '-' + String(ayer.getDate()).padStart(2,'0');
  if (dia === ayerISO) return 'Ayer';
  return fechaLarga(dia);
}

function pintarChat(cont, msgs){
  cont._msgs = msgs;   // lo usa el envío optimista para poder revertir
  if (!msgs.length){
    cont.innerHTML = '<div class="chat-vacio">Todavía no hay mensajes.<br>' +
                     'Escribí el primero acá abajo.</div>';
    return;
  }

  const yo = miAutor();
  // ¿Estaba abajo de todo? Si sí, seguimos el hilo; si estaba leyendo algo
  // más arriba, no le movemos la pantalla de golpe.
  const pegadoAbajo = cont.scrollHeight - cont.scrollTop - cont.clientHeight < 60;

  let ultimoDia = '';
  cont.innerHTML = msgs.map(m => {
    let sep = '';
    const dia = soloFecha(m.creado_en);
    if (dia !== ultimoDia){
      ultimoDia = dia;
      sep = '<div class="dia-chat">' + esc(etiquetaDia(m.creado_en)) + '</div>';
    }

    const mio = m.autor === yo;
    // Tildes solo en los míos: uno gris al enviarse, dos azules cuando el
    // otro lado ya lo abrió.
    let tilde = '';
    if (mio){
      if (m.enviando) tilde = '<span class="tilde">🕘</span>';
      else {
        const loLeyo = yo === 'optica' ? m.leido_consultorio : m.leido_optica;
        tilde = '<span class="tilde' + (loLeyo ? ' leido' : '') + '">' +
                (loLeyo ? '✓✓' : '✓') + '</span>';
      }
    }

    const quien = mio ? '' :
      esc(m.autor_nombre || (m.autor === 'optica' ? 'Óptica' : 'Consultorio')) + ' · ';

    return sep + '<div class="msg ' + (mio ? 'mio' : 'otro') + (m.enviando ? ' enviando' : '') + '">' +
           esc(m.texto) +
           '<div class="meta">' + quien + horaCorta(m.creado_en) + tilde + '</div></div>';
  }).join('');

  if (pegadoAbajo) cont.scrollTop = cont.scrollHeight;
}

/** Crece con el texto, como el campo de WhatsApp.
 *  Si el modal todavía está oculto, medir da 0 y el campo quedaba aplastado
 *  contra el botón de enviar: por eso se sale sin tocar nada y el mínimo
 *  nunca baja de los 44px del diseño. */
function ajustarAltura(ta){
  if (!ta.offsetParent) return;          // oculto: cualquier medida daría 0
  ta.style.height = 'auto';
  ta.style.height = Math.max(44, Math.min(ta.scrollHeight, 120)) + 'px';
}

/* Mientras hay un chat abierto se consulta más seguido: es una conversación,
   esperar un minuto la respuesta se siente roto. Al cerrarlo vuelve al ritmo
   normal, así no gastamos de gusto. */
let RELOJ_CHAT = null;
let CHAT_ABIERTO = null;   // id de la ficha, o 'general'

function arrancarRelojChat(cual){
  CHAT_ABIERTO = cual;
  clearInterval(RELOJ_CHAT);
  RELOJ_CHAT = setInterval(() => {
    if (document.hidden || !SESION) return;
    if (CHAT_ABIERTO === 'general') refrescarChatGeneral();
    else if (CHAT_ABIERTO != null) cargarChat(CHAT_ABIERTO);
  }, 12000);
}

function pararRelojChat(){
  clearInterval(RELOJ_CHAT);
  RELOJ_CHAT = null;
  CHAT_ABIERTO = null;
}

async function cargarChat(agendaId){
  try{
    const json = await api('/mensajes?agenda_id=' + agendaId);
    if (!json.success) return;
    pintarChat(document.getElementById('f-chat'), json.data);
    if (NO_LEIDOS[agendaId]){
      await api('/mensajes?agenda_id=' + agendaId, {method:'PATCH'});
      delete NO_LEIDOS[agendaId];
      render();
    }
  }catch(e){}
}

/**
 * Envío optimista: el mensaje aparece en el acto con un relojito, y cuando el
 * servidor confirma pasa a tilde. Si falla, se devuelve el texto al campo en
 * lugar de perderlo.
 */
async function enviarGenerico(ta, cont, cuerpo, recargar){
  const txt = ta.value.trim();
  if (!txt) return;
  ta.value = '';
  ajustarAltura(ta);

  const provisorio = {
    id: 'tmp' + Date.now(),
    autor: miAutor(),
    autor_nombre: SESION.nombre || SESION.usuario,
    texto: txt,
    creado_en: new Date().toISOString(),
    enviando: true,
  };
  const previos = cont._msgs || [];
  cont._msgs = previos.concat([provisorio]);
  pintarChat(cont, cont._msgs);
  cont.scrollTop = cont.scrollHeight;

  try{
    const json = await api('/mensajes', {method:'POST', body: JSON.stringify(cuerpo(txt))});
    if (!json.success){
      showToast(json.error || 'No se pudo enviar', 'err');
      cont._msgs = previos;
      pintarChat(cont, previos);
      ta.value = txt;
      return;
    }
    await recargar();
  }catch(e){
    showToast('Sin conexión, no se envió', 'err');
    cont._msgs = previos;
    pintarChat(cont, previos);
    ta.value = txt;
  }
}

async function enviarMensaje(){
  if (!FICHA) return;
  const id = FICHA.id;
  await enviarGenerico(
    document.getElementById('f-chat-txt'),
    document.getElementById('f-chat'),
    (txt) => ({agenda_id: id, texto: txt}),
    () => cargarChat(id));
}

async function refrescarChatGeneral(){
  try{
    const json = await api('/mensajes');
    if (json.success) pintarChat(document.getElementById('g-chat'), json.data);
  }catch(e){}
}

async function abrirChatGeneral(){
  document.getElementById('modal-general').classList.add('abierto');
  arrancarRelojChat('general');
  try{
    const json = await api('/mensajes');
    if (json.success) pintarChat(document.getElementById('g-chat'), json.data);
    document.getElementById('g-chat').scrollTop = 9e9;
    await api('/mensajes', {method:'PATCH'});
    delete NO_LEIDOS['general'];
    document.getElementById('badge-general').style.display = 'none';
  }catch(e){}
}

function cerrarChatGeneral(){
  pararRelojChat();
  document.getElementById('modal-general').classList.remove('abierto');
}

async function enviarMensajeGeneral(){
  await enviarGenerico(
    document.getElementById('g-chat-txt'),
    document.getElementById('g-chat'),
    (txt) => ({texto: txt}),
    () => refrescarChatGeneral());
}

/* ═══════════════════════════════════════════════════════════
   Notificaciones (funcionan con la agenda instalada como app)
   ═══════════════════════════════════════════════════════════ */
let SW = null;

const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
/** ¿Está abierta como aplicación instalada y no como pestaña del navegador? */
function esApp(){
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}

async function registrarSW(){
  if (!('serviceWorker' in navigator)) return null;
  try{
    SW = await navigator.serviceWorker.register('/sw-agenda.js', {scope: '/agenda'});
    return SW;
  }catch(e){ return null; }
}

function b64aBytes(base64){
  const relleno = '='.repeat((4 - base64.length % 4) % 4);
  const s = (base64 + relleno).replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(s);
  return Uint8Array.from([...bin].map(c => c.charCodeAt(0)));
}

/** El cartel se esconde solo por esta vez: al volver a abrir la agenda
 *  vuelve a aparecer. Deja de mostrarse cuando está instalada Y con los
 *  avisos activados, que es lo que queremos que pase. */
function ocultarAvisoNotif(){
  document.getElementById('aviso-notif').classList.remove('ver');
  try{ sessionStorage.setItem('notif_ocultar', '1'); }catch(e){}
}

function mostrarAviso(titulo, detalle, botones, icono){
  document.getElementById('notif-ic').textContent = icono || '🔔';
  document.getElementById('notif-tt').textContent = titulo;
  document.getElementById('notif-dd').innerHTML = detalle;
  document.getElementById('notif-bs').innerHTML = botones || '';
  document.getElementById('aviso-notif').classList.add('ver');
}

/* Chrome guarda el pedido de instalación para dispararlo cuando queramos:
   así el botón abre el diálogo real del sistema en vez de explicar dónde
   está el menú del navegador. */
let PEDIDO_INSTALAR = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  PEDIDO_INSTALAR = e;
  if (SESION) revisarNotificaciones();
});
window.addEventListener('appinstalled', () => {
  PEDIDO_INSTALAR = null;
  showToast('Agenda instalada. Abrila desde el icono y activá los avisos.', 'ok');
  revisarNotificaciones();
});

async function instalarApp(){
  if (!PEDIDO_INSTALAR){
    showToast('Instalala desde el menú del navegador', 'err');
    return;
  }
  PEDIDO_INSTALAR.prompt();
  try{ await PEDIDO_INSTALAR.userChoice; }catch(e){}
  PEDIDO_INSTALAR = null;
}

/** ¿Están los avisos realmente andando en este dispositivo? */
async function avisosActivos(){
  if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) return false;
  if (Notification.permission !== 'granted') return false;
  if (!SW) await registrarSW();
  if (!SW) return false;
  return !!(await SW.pushManager.getSubscription());
}

/**
 * Decide qué cartel mostrar. Insiste en cada visita hasta que la agenda quede
 * instalada y con los avisos andando: recién ahí desaparece para siempre.
 */
async function revisarNotificaciones(){
  const aviso = document.getElementById('aviso-notif');
  aviso.classList.remove('ver');

  const instalada = esApp();
  const avisos = await avisosActivos();

  // Meta cumplida: instalada y avisando. No molestamos más.
  if (instalada && avisos) return;

  // Si la cerró en esta visita, esperar a la próxima vez que abra
  try{ if (sessionStorage.getItem('notif_ocultar')) return; }catch(e){}

  // ── Paso 1: que la instale ──
  if (!instalada){
    if (esIOS){
      mostrarAviso('Instalá la agenda en tu teléfono',
        'Así la abrís de un toque y podés recibir los avisos. En iPhone es el único ' +
        'modo de que lleguen las notificaciones.' +
        '<ol class="pasos"><li>Tocá <b>Compartir</b> ⬆️ abajo en Safari</li>' +
        '<li>Elegí <b>Agregar a inicio</b></li>' +
        '<li>Abrila desde el icono nuevo del ojo azul</li></ol>', '', '📲');
      return;
    }
    mostrarAviso('Instalá la agenda como aplicación',
      'Queda con su icono en el teléfono, se abre de un toque y te avisa cuando llega ' +
      'un paciente nuevo.',
      PEDIDO_INSTALAR
        ? '<button class="btn" onclick="instalarApp()">📲 Instalar</button>' +
          (avisos ? '' : '<button class="btn btn-sec" onclick="activarNotificaciones()">🔔 Solo avisos</button>')
        : '<button class="btn btn-sec" onclick="activarNotificaciones()">🔔 Activar avisos</button>',
      '📲');
    return;
  }

  // ── Paso 2: ya instalada, falta el permiso ──
  if (Notification.permission === 'denied'){
    mostrarAviso('Los avisos están bloqueados',
      'Este teléfono tiene las notificaciones de la agenda bloqueadas. Se vuelven a ' +
      'habilitar desde los ajustes del teléfono, en los permisos de esta aplicación.', '', '🔕');
    return;
  }

  mostrarAviso('Ya casi: activá los avisos',
    'Último paso. Te avisamos apenas llega un paciente nuevo o un mensaje, sin que ' +
    'tengas que entrar a mirar.',
    '<button class="btn" onclick="activarNotificaciones()">🔔 Activar avisos</button>');
}

async function activarNotificaciones(){
  try{
    if (esIOS && !esApp()){
      showToast('En iPhone primero agregala a la pantalla de inicio', 'err');
      return;
    }

    const permiso = await Notification.requestPermission();
    if (permiso !== 'granted'){
      showToast('No se dio permiso para las notificaciones', 'err');
      return;
    }

    if (!SW) await registrarSW();
    if (!SW){ showToast('Este navegador no soporta notificaciones', 'err'); return; }
    await navigator.serviceWorker.ready;

    const info = await api('/push');
    if (!info.success || !info.clave){
      showToast(info.error || 'El servidor no tiene las notificaciones configuradas', 'err');
      return;
    }

    let sub = await SW.pushManager.getSubscription();
    if (!sub){
      sub = await SW.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: b64aBytes(info.clave),
      });
    }

    const j = sub.toJSON();
    const r = await api('/push', {
      method:'POST',
      body: JSON.stringify({endpoint: j.endpoint, keys: j.keys, prueba: true}),
    });
    if (!r.success){ showToast(r.error || 'No se pudo activar', 'err'); return; }

    showToast('Listo, ya vas a recibir los avisos', 'ok');
    // Si todavía no está instalada, el cartel sigue insistiendo con ese paso
    try{ sessionStorage.removeItem('notif_ocultar'); }catch(e){}
    revisarNotificaciones();
  }catch(e){
    // Brave trae apagado el servicio de push de Google por privacidad, y
    // pushManager.subscribe() falla con "push service error". Sin este aviso
    // el mensaje no dice qué hacer y uno queda trabado sin entender por qué.
    const msg = String(e && e.message || e);
    let esBrave = false;
    try{ esBrave = !!(navigator.brave && await navigator.brave.isBrave()); }catch(_){}

    if (esBrave || /push service|registration failed/i.test(msg)){
      mostrarAviso('Brave tiene los avisos apagados',
        'Brave desactiva el servicio de notificaciones de Google por privacidad. Para usarlo:' +
        '<ol class="pasos"><li>Abrí <b>brave://settings/privacy</b></li>' +
        '<li>Activá <b>«Usar servicios de Google para la mensajería push»</b></li>' +
        '<li><b>Cerrá y volvé a abrir Brave</b> (no alcanza con recargar)</li>' +
        '<li>Volvé acá y tocá Activar</li></ol>' +
        'Si preferís no tocar eso, la agenda funciona igual — pero tenés que entrar a mirar.',
        '<button class="btn" onclick="activarNotificaciones()">🔔 Ya lo hice, activar</button>', '🦁');
      showToast('Brave bloquea las notificaciones. Mirá el cartel de arriba.', 'err');
      return;
    }
    showToast('No se pudieron activar: ' + msg, 'err');
  }
}

// El service worker pide refrescar cuando tocan una notificación
navigator.serviceWorker?.addEventListener?.('message', (e) => {
  if (e.data?.tipo === 'refrescar' && SESION) refrescar();
});

/* ═══════════════════════════════════════════════════════════
   Arranque
   ═══════════════════════════════════════════════════════════ */
// El Enter en los campos ya lo maneja el submit del formulario, no hace falta
// engancharlo a mano (si no, se dispararía el login dos veces).
['f-chat-txt','g-chat-txt'].forEach(id => {
  const ta = document.getElementById(id);
  ta.addEventListener('keydown', e => {
    // Enter envía; Shift+Enter hace salto de línea, igual que en WhatsApp Web
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      id === 'f-chat-txt' ? enviarMensaje() : enviarMensajeGeneral();
    }
  });
  ta.addEventListener('input', () => ajustarAltura(ta));
});

// Con la página oculta se corta el reloj; al volver, refresco inmediato y sigue.
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ pararReloj(); return; }
  if (SESION){ refrescar(); arrancarReloj(); }
});

// Entrar directo si ya había iniciado sesión en este teléfono
try{
  const guardada = localStorage.getItem('medico_sesion') ||
                   sessionStorage.getItem('medico_sesion');
  if (guardada){
    SESION = JSON.parse(guardada);
    guardarSesion();          // migra las sesiones viejas a localStorage
    arrancar();
  }
}catch(e){}
</script>
